<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIGREP · Alcarusi</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <h1>SIGREP</h1>
      <p class="subtitle">Sistema Integral de Gestión para Repostería — Alcarusi</p>
      <input id="login-usuario" type="text" placeholder="Usuario" value="duena" />
      <input id="login-password" type="password" placeholder="Contraseña" value="duena123" />
      <button id="btn-login">Entrar</button>
      <p class="hint">Demo: duena / duena123 · ayudante1 / ayudante123</p>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <div id="app" class="screen">
    <nav class="sidebar">
      <div class="brand">SIGREP</div>
      <button class="nav-btn active" data-view="calculadora">Calculadora de precios</button>
      <button class="nav-btn" data-view="inventario">Inventario</button>
      <button class="nav-btn" data-view="pedidos">Pedidos</button>
      <button class="nav-btn" data-view="clientes">Clientes</button>
      <button class="nav-btn" data-view="reportes">Reportes</button>
      <div class="sidebar-footer">
        <span id="user-info"></span>
        <button id="btn-logout">Salir</button>
      </div>
    </nav>
    <main id="content"></main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/views/calculadora.js"></script>
  <script src="/js/views/inventario.js"></script>
  <script src="/js/views/pedidos.js"></script>
  <script src="/js/views/clientes.js"></script>
  <script src="/js/views/reportes.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
